# Generated by DevDigest. Regenerate from the agent's CI tab after changing
# triggers or "Post results as"; hand edits are kept until you do.
name: DevDigest Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: devdigest-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - name: Run DevDigest review
        run: node .devdigest/runner.mjs
        env:
          DEVDIGEST_AGENT: security-reviewer
          DEVDIGEST_REPOSITORY: ${{ github.repository }}
          DEVDIGEST_PR_NUMBER: ${{ github.event.pull_request.number }}
          DEVDIGEST_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          DEVDIGEST_POST_AS: github_review
          DEVDIGEST_MAX_DIFF_LINES: '15000'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the review result
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: devdigest-result
          path: devdigest-result.json
