# Server integration suite — the 12 DB-backed test files (`*.it.test.ts`).
#
# Each spins up a real Postgres (pgvector) via testcontainers, builds the
# Fastify app, migrates + seeds, and exercises the routes end-to-end against
# the DB. Docker is present on ubuntu-latest, so testcontainers can pull the
# image; the tests also self-skip (`dockerAvailable()`) if Docker is somehow
# absent, so this job degrades to a no-op rather than a hard failure.
#
# Linux only — testcontainers needs a Linux Docker daemon (Windows runners
# don't provide one).
name: server integration

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-integration.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-integration.yml'

permissions:
  contents: read

concurrency:
  group: server-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: tests (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Integration tests load server src, which imports @devdigest/reviewer-core
      # (../reviewer-core/src) → which imports `openai`/`zod`. Install reviewer-core's
      # deps so those resolve at module load. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      # `pnpm test:it`, not an inlined vitest call. The script carries
      # `--no-file-parallelism`, and that flag is the difference between a green
      # suite and an intermittent one: there are 23 `*.it.test.ts` files, each
      # starts its own Postgres container, and in parallel they starve each other
      # — measured 2026-08-28, three consecutive parallel runs failed on three,
      # five and one test respectively, never the same names, while serial passed
      # 197/197 twice. Inlining the command here is how the flag gets lost.
      #
      # (The older comment here said package.json was skip-worktree and could not
      # be relied on. `git ls-files -v` reports `H` — it is an ordinary tracked
      # file, and has been for long enough that nobody noticed.)
      #
      # vitest's config gives these a 120s timeout for container spin-up; no API
      # keys needed — LLM/git are mocked.
      - run: pnpm test:it
