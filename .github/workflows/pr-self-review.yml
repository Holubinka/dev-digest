# pr-self-review scripts — the deterministic half of the pre-PR gate.
#
# Six shell scripts in scripts/pr-self-review/ do everything in that skill that
# does not need a model: scope the branch, run Track A, filter against the
# baseline, render the verdict, and refuse a push (gate.sh, the PreToolUse hook).
# Their tests are plain Bash — no Node, no pnpm, no database — so this job is
# checkout plus one command.
#
# fetch-depth: 0 is load-bearing, not caution. scope.sh asks git for the
# merge-base with main, and the suite builds throwaway repos with real commits
# and branches. actions/checkout's default shallow clone has no main and no
# merge-base, so scope.test.sh fails on a checkout that is otherwise correct.
#
# The suite is hermetic: every test runs inside a `mktemp -d` repository, and
# run.sh compares this repository's HEAD and branch list before and after as a
# canary. It once escaped for real.
name: pr-self-review scripts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/pr-self-review/**'
      - '.github/workflows/pr-self-review.yml'
  pull_request:
    paths:
      - 'scripts/pr-self-review/**'
      - '.github/workflows/pr-self-review.yml'

permissions:
  contents: read

concurrency:
  group: pr-self-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # jq is preinstalled on ubuntu-latest; every script hard-depends on it,
      # so fail here with a clear message rather than inside a test.
      - name: Check jq is available
        run: jq --version

      - name: Run the script tests
        run: bash scripts/pr-self-review/test/run.sh
